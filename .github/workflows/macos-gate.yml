# 在**真 macOS 26 + 真 bash 3.2** 下跑离线门禁。
#
# 为什么需要：本地仿真跑在 Windows 的 Git Bash（bash 5）上，
# bash 3.2 的坑（中文邻接变量被吞、set -u 直接退出）只有真 macOS 才暴露。
#
# runs-on 说明：macos-26 = arm64 标准 runner（free/private 额度按平台规则计费）；
# `macos-26-intel` 属 larger runner，需要付费套餐，一般用不到。
name: macos-gate

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 环境自述（证明是真 macOS + 真 bash 3.2）
        shell: bash
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          echo "bash: $(bash --version | head -1)"
          echo "python: $(python3 -V 2>&1)"
          echo "shasum: $(command -v shasum || echo 缺失)"

      - name: 可执行位自检（stubs 与 shim 必须是 100755，否则会落到真实系统命令）
        shell: bash
        run: |
          set -e
          test -x testkit/bin/python || { echo "::error::testkit/bin/python 不可执行（git mode 应为 100755）"; exit 1; }
          for s in testkit/harness/stubs/*; do
            test -x "$s" || { echo "::error::桩件不可执行：$s"; exit 1; }
          done
          echo "全部桩件可执行 ✓"

      - name: 封存清单自检
        shell: bash
        run: |
          set -e
          echo "== igpu-build/SHA256SUMS =="
          ( cd igpu-build && shasum -a 256 -c SHA256SUMS | tail -3 )
          echo "== dist/SHA256SUMS =="
          ( cd igpu-build/dist && shasum -a 256 -c SHA256SUMS | tail -2 )
          echo "== 顶层 SHA256SUMS（脱敏镜像清单） =="
          shasum -a 256 -c SHA256SUMS | tail -3
          echo "全部 OK"

      - name: 七套仿真（真 bash 3.2，含 C++ 模型单测）
        shell: bash
        working-directory: testkit/harness
        run: |
          set -e
          for f in run-state.sh run.sh run-collect.sh run-probe.sh run-kcgate.sh run-trip.sh run-model.sh; do
            echo "========== $f =========="
            bash "$f"
          done

      - name: cases（Python）
        shell: bash
        working-directory: testkit
        run: |
          set -e
          for f in cases.py cases2.py cases3.py cases4.py; do
            echo "========== $f =========="
            python3 "$f"
          done

      - name: 失败诊断日志（只传测试日志，不传整目录）
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: harness-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            testkit/harness/last-*.log

  # 用 GitHub 的 macOS runner 代替 Mac mini 编译 A0 kext，并把产物作为 artifact 提供下载。
  # Mac mini 原来的职责：编译 / kextutil / 真 bash 回归 —— 前两项这里都有；
  # 只有"对目标机 KC 做符号核验"必须在真机跑（onsite/05-kcgate.sh）。
  build-loadprobe:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: 环境（确认有 Xcode/CLT 与 SDK）
        shell: bash
        run: |
          sw_vers
          echo "arch: $(uname -m)"
          xcrun clang++ --version | head -2
          echo "sdk: $(xcrun --sdk macosx --show-sdk-version)"

      - name: 构建 IGPULoadProbe（x86_64 交叉编译）
        shell: bash
        working-directory: igpu-build/kext/IGPULoadProbe
        run: |
          set -e
          chmod +x build.sh
          ARCH=x86_64 ./build.sh 2>&1 | tee /tmp/loadprobe-build.log

      - name: 静态门禁（架构 / _kmod_info / IOFramebuffer 未定义引用）
        shell: bash
        run: |
          set -e
          BIN=igpu-build/kext/IGPULoadProbe/IGPULoadProbe.kext/Contents/MacOS/IGPULoadProbe
          file "$BIN"
          file "$BIN" | grep -q 'Mach-O 64-bit kext bundle x86_64' \
            || { echo "::error::产物不是 x86_64 kext bundle"; exit 1; }

          echo "--- _kmod_info 必须是已定义的外部符号 ---"
          nm -arch x86_64 -gU "$BIN" \
            | awk 'NF>=3 && $3=="_kmod_info" && $2 ~ /^[A-Za-z]$/ {f=1} END{exit f?0:1}' \
            || { echo "::error::缺 _kmod_info（OC 会报 Invalid Parameter）"; exit 1; }

          echo "--- A0 的被测依赖：必须存在对 IOFramebuffer 的未定义引用 ---"
          N=$(nm -arch x86_64 -u "$BIN" | grep -c IOFramebuffer || true)
          echo "undef IOFramebuffer = ${N}"
          [ "${N}" -ge 1 ] || { echo "::error::没有 IOFramebuffer 未定义引用，A0 失去意义"; exit 1; }

          echo "--- Info.plist 的依赖声明 ---"
          plutil -extract OSBundleLibraries xml1 -o - \
            igpu-build/kext/IGPULoadProbe/IGPULoadProbe.kext/Contents/Info.plist

          echo "--- 产物哈希 ---"
          shasum -a 256 "$BIN"

      - name: 打包 kext（下载后可直接拷进 ESP）
        shell: bash
        run: |
          set -e
          cd igpu-build/kext/IGPULoadProbe
          ditto -c -k --sequesterRsrc --keepParent IGPULoadProbe.kext /tmp/IGPULoadProbe.kext.zip
          ls -l /tmp/IGPULoadProbe.kext.zip
          shasum -a 256 /tmp/IGPULoadProbe.kext.zip

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: IGPULoadProbe-kext
          retention-days: 30
          path: |
            /tmp/IGPULoadProbe.kext.zip
            /tmp/loadprobe-build.log